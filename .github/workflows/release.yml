name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/cc-beacon
          mkdir -p dist
          cp "$BIN" dist/cc-beacon-macos
          chmod +x dist/cc-beacon-macos

      - name: Verify binary
        run: |
          file dist/cc-beacon-macos
          dist/cc-beacon-macos --help || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cc-beacon-macos
          generate_release_notes: true
